<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Page Not Found (404) — Roammate</title>
<meta name="description" content="The page you were looking for doesn't exist on Roammate. Return home to date, connect, and travel.">
<meta name="theme-color" content="#C2462E">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .error-wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    text-align: center;
    max-width: 540px;
    margin: 0 auto;
  }
  .error-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    background: rgba(194, 70, 46, 0.12);
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 16px;
  }
  .error-code {
    font-family: 'Fraunces', serif;
    font-size: clamp(64px, 14vw, 96px);
    font-weight: 600;
    line-height: 1;
    margin: 0 0 10px;
    color: var(--text);
    background: linear-gradient(135deg, var(--text) 30%, var(--accent) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .error-desc {
    color: var(--muted);
    font-size: 16px;
    line-height: 1.5;
    margin: 0 0 28px;
  }
  .error-actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
    max-width: 320px;
    margin-bottom: 32px;
  }
  .error-links {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-top: 10px;
  }
  .error-links a {
    color: var(--muted);
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    text-decoration: none;
    transition: all .2s;
  }
  .error-links a:hover {
    color: var(--text);
    border-color: var(--text);
  }
</style>
</head>
<body>
<div class="error-wrap">
  <div class="hero-logo" style="margin-bottom:14px">🧭</div>
  <div class="error-badge">Lost in the wilderness</div>
  <h1 class="error-code">404</h1>
  <h2 style="font-size:24px;margin:0 0 8px">Off the beaten path.</h2>
  <p class="error-desc">
    The trail you're following doesn't exist or has moved.<br>
    Don't worry, every unexpected detour is the start of another adventure.
  </p>
  <div class="error-actions">
    <a href="/" class="btn primary" style="text-decoration:none">← Return Home</a>
  </div>
  <div style="font-size:12px;color:var(--muted);margin-bottom:8px">Quick destinations:</div>
  <div class="error-links">
    <a href="/">🧭 Discover</a>
    <a href="/">🌴 Meetups &amp; Events</a>
    <a href="/">🗺️ Shared Trips</a>
  </div>
</div>
</body>
</html>
